name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lwc:
    name: Lint, format, and Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run prettier:check
      - run: npm run test:coverage

  apex:
    name: Deploy check and Apex tests
    # Runs against a Developer Edition org when the SFDX_AUTH_URL secret is set.
    # Create it with: sf org display --verbose --json -o <alias>  (copy sfdxAuthUrl)
    runs-on: ubuntu-latest
    needs: lwc
    env:
      SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no org is connected
        if: env.SFDX_AUTH_URL == ''
        run: echo "SFDX_AUTH_URL is not set; skipping the org deploy check."
      - uses: actions/setup-node@v4
        if: env.SFDX_AUTH_URL != ''
        with:
          node-version: 22
      - name: Install Salesforce CLI
        if: env.SFDX_AUTH_URL != ''
        run: npm install --global @salesforce/cli
      - name: Authenticate
        if: env.SFDX_AUTH_URL != ''
        run: |
          echo "$SFDX_AUTH_URL" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias ci --set-default
          rm auth.txt
      - name: Validate deploy and run Apex tests
        if: env.SFDX_AUTH_URL != ''
        run: sf project deploy validate --source-dir force-app --test-level RunLocalTests --coverage-formatters text --wait 30
